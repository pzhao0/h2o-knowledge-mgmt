# Administrator-owned GPU Operator configuration; not installed by Helm.
# NVIDIA RTX PRO 6000 Blackwell 96 GB: H2O model 48 GB, H2O function 48 GB.
# Chat inference uses an external endpoint. GPU index 0 only; MIG advertisement must be mixed.
# Apply in the GPU Operator namespace. If a custom config is already in use,
# merge this profile into it instead of replacing the existing configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: h2o-rtx-pro-6000-mig-config
data:
  config.yaml: |
    version: v1
    mig-configs:
      all-disabled:
        - devices: [0]
          mig-enabled: false
      h2o-48-48:
        - devices: [0]
          mig-enabled: true
          mig-devices:
            "2g.48gb": 2
