replicaCount: 1

image:
  repository: quay.io/ecosystem-appeng/h2o-knowledge-mgmt-api
  tag: "0.2.0"
  digest: sha256:7e92072fff69656c535ef7d6b28a5116057e8a447f33e1f64a85e130fd0c0815
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

# External OpenAI-compatible endpoint (MaaS or another provider).
# Use the API base URL, including /v1 if required by the provider.
llm:
  baseUrl: ""
  model: ""
  timeoutSeconds: 60
  # Optional token supplied at deployment time; never commit a real credential.
  apiKey: ""

aws-compatible-storage:
  enabled: true
  fullnameOverride: h2o-knowledge-mgmt-storage
  s3:
    region: us-east-1
    accessKeyId: ""
    secretAccessKey: ""
  auth:
    enabled: false
  route:
    enabled: false
    s3Api:
      enabled: false
  storage:
    data:
      size: 10Gi

sampleFileUpload:
  enabled: true
  bucket: documents
  region: us-east-1
  image:
    repository: quay.io/ecosystem-appeng/h2o-knowledge-mgmt-document-uploader-job
    tag: "0.1.4"
    digest: sha256:54f8ea596033b2704afd7352a90d3e11bb89b60c963807f2bb4e8903e756fde1
    pullPolicy: IfNotPresent
  urls:
    - https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/pdf/overview/OpenShift_Container_Platform-4.19-Overview-en-US.pdf
