replicaCount: 1

image:
  repository: quay.io/ecosystem-appeng/h2o-knowledge-mgmt-api
  tag: "0.1.0"
  digest: sha256:eb201124d543dcd23a3a735feeefaf6320c4d7c12d1dafe84a6287aa9e61069a
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

llm:
  baseUrl: http://h2o-llm-vllm/v1
  model: RedHatAI/Llama-3.2-3B-Instruct-quantized.w8a8
  timeoutSeconds: 60

# RHOAI/KServe inference is enabled by default.
llm-service:
  enabled: true
  # Customize for your cluster here.
  deviceConfigs:
    gpu:
      image: vllm/vllm-openai:v0.11.1@sha256:d5b12dfb74d605615f8b29ebafaa52294c118bcac7bc9e941785c4108fdb913a
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
          operator: Exists
  servingRuntime:
    name: h2o-vllm-runtime
    # This profile uses the model's native tokenizer chat template. Omit the
    # upstream ConfigMap mount: its lookup-based template disappears on upgrades.
    volumeMounts:
      - name: shm
        mountPath: /dev/shm
      - name: vllm-home
        mountPath: /vllm
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: vllm-home
        emptyDir: {}
    # This RedHatAI repository is public and ungated; no HF token is required.
    # Lists replace upstream defaults, so the HF_TOKEN Secret reference is omitted.
    env:
      - name: HOME
        value: /vllm
      - name: HF_HOME
        value: /vllm/hf-home
      - name: HF_HUB_OFFLINE
        value: "0"
  secret:
    enabled: false

global:
  models:
    h2o-llm:
      id: RedHatAI/Llama-3.2-3B-Instruct-quantized.w8a8
      enabled: true
      resources:
        requests:
          cpu: "1"
          memory: 16Gi
          ephemeral-storage: 20Gi
        limits:
          cpu: "2"
          memory: 32Gi
          ephemeral-storage: 30Gi
      # Pin model weights and bound inference memory and concurrency.
      args:
        - --revision
        - 505dad2e5ceed6c787249c634a05f2d6cf8ad9e4
        - --quantization
        - compressed-tensors
        - --max-model-len
        - "2048"
        - --max-num-seqs
        - "4"
        - --gpu-memory-utilization
        - "0.75"

aws-compatible-storage:
  enabled: true
  fullnameOverride: h2o-knowledge-mgmt-storage
  s3:
    region: us-east-1
    accessKeyId: ""
    secretAccessKey: ""
  auth:
    enabled: false
  route:
    enabled: false
    s3Api:
      enabled: false
  storage:
    data:
      size: 10Gi

sampleFileUpload:
  enabled: true
  bucket: documents
  region: us-east-1
  image:
    repository: quay.io/ecosystem-appeng/h2o-knowledge-mgmt-document-uploader-job
    tag: "0.1.4"
    digest: sha256:54f8ea596033b2704afd7352a90d3e11bb89b60c963807f2bb4e8903e756fde1
    pullPolicy: IfNotPresent
  urls:
    - https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/pdf/overview/OpenShift_Container_Platform-4.19-Overview-en-US.pdf
