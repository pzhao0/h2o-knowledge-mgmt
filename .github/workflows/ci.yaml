name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, test, and lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python dependencies
        run: make setup

      - name: Lint Python
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Helm dependency repository
        run: helm repo add ai-architecture-charts https://rh-ai-quickstart.github.io/ai-architecture-charts

      - name: Lint Helm chart
        run: make helm-lint
